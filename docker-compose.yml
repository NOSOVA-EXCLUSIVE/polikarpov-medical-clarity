services:
  postgres:
    image: postgres:16-alpine
    container_name: evgeny-ortho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evgeny_ortho
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evgeny_ortho"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
